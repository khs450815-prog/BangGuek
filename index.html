<meta name="theme-color" content="#2F6B57">

<style>
:root{
  --paper:#F2F4F1; --panel:#FAFBF9; --ink:#1E2422; --muted:#5E6862; --line:#CDD5CF;
  --jade:#2F6B57; --jade-soft:#DCEAE3; --plum:#8B3A4A; --plum-soft:#F1DFE3; --mark:#E3EFE8;
  --serif:"Noto Serif KR","Songti SC","Batang",serif;
  --sans:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#141917; --panel:#1A201D; --ink:#E4EAE6; --muted:#9AA59F; --line:#2E3833;
    --jade:#72BB9E; --jade-soft:#1F3A30; --plum:#DA8698; --plum-soft:#3B232A; --mark:#23413A;
  }
}
:root[data-theme="dark"]{
  --paper:#141917; --panel:#1A201D; --ink:#E4EAE6; --muted:#9AA59F; --line:#2E3833;
  --jade:#72BB9E; --jade-soft:#1F3A30; --plum:#DA8698; --plum-soft:#3B232A; --mark:#23413A;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.55}
button{font:inherit;color:inherit}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--jade);outline-offset:2px}

.head{padding:28px 24px 18px;border-bottom:1px solid var(--line);display:flex;align-items:flex-end;gap:20px;flex-wrap:wrap}
.head h1{font-family:var(--serif);font-weight:700;font-size:44px;line-height:1;margin:0;letter-spacing:.04em}
.head h1 small{display:block;font-family:var(--sans);font-size:15px;font-weight:500;letter-spacing:0;margin-top:10px;color:var(--muted)}
#installBtn{background:var(--jade);color:var(--paper);border-color:var(--jade)}
.tabs{margin-left:auto;display:flex;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:4px}
.tabs button{border:0;background:none;padding:7px 14px;border-radius:7px;cursor:pointer;font-weight:500;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--paper)}

.wrap{display:grid;grid-template-columns:minmax(340px,440px) 1fr;min-height:calc(100vh - 110px)}
.side{border-right:1px solid var(--line);background:var(--panel);padding:18px 20px 40px;overflow-y:auto;max-height:calc(100vh - 110px);position:sticky;top:0}
.main{padding:22px 28px 80px;min-width:0}

.tools{display:flex;gap:8px;align-items:center;margin-bottom:10px}
.tools input{flex:1;min-width:0;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink);font:inherit}
.btn{border:1px solid var(--line);background:var(--paper);padding:8px 12px;border-radius:8px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.legend{font-size:12.5px;color:var(--muted);margin:0 0 14px}
.legend b{font-weight:600}
.legend .y{color:var(--jade)} .legend .n{color:var(--plum)}

.cat{margin:0 0 18px}
.cat h2{font-size:14px;color:var(--ink)!important;font-weight:600;color:var(--muted);margin:0 0 8px;padding-bottom:5px;border-bottom:1px dashed var(--line)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips+.chips{margin-top:8px;padding-top:8px;border-top:1px dotted var(--line)}
.cat h2 .hz{font-family:var(--serif);font-weight:400;margin-left:4px}
.chip{border:1px solid var(--line);background:var(--paper);border-radius:6px;padding:4px 9px 3px;cursor:pointer;text-align:left;line-height:1.2;transition:background .12s,border-color .12s}
.chip .h{font-family:var(--serif);font-size:15.5px;font-weight:600;display:block}
.chip .k{font-size:11px;color:var(--muted);display:block;margin-top:1px}
.chip.sub{border-style:dashed;padding:3px 8px 2px}
.chip.sub .h{font-size:14px;font-weight:400}
.chip:hover{border-color:var(--muted)}
.chip.on{background:var(--jade);border-color:var(--jade);color:var(--paper)}
.chip.on .k{color:var(--paper);opacity:.85}
.chip.off{background:var(--plum-soft);border-color:var(--plum);color:var(--plum)}
.chip.off .h{text-decoration:line-through}
.chip[hidden]{display:none}

.sel{display:flex;flex-wrap:wrap;gap:6px;align-items:center;min-height:32px;margin-bottom:18px}
.sel .lab{font-size:13px;color:var(--muted);margin-right:4px}
.pill{font-family:var(--serif);font-size:15px;padding:2px 10px;border-radius:999px;border:1px solid var(--jade);color:var(--jade);background:var(--jade-soft);cursor:pointer}
.pill.no{border-color:var(--plum);color:var(--plum);background:var(--plum-soft);text-decoration:line-through}

.empty{max-width:560px;padding:40px 0}
.empty p{color:var(--muted);margin:0 0 14px}
.empty .big{font-family:var(--serif);font-size:26px;color:var(--ink);line-height:1.5}

.lead{border:1px solid var(--line);background:var(--panel);border-radius:14px;padding:26px 28px;margin-bottom:22px}
.lead .nm{font-family:var(--serif);font-weight:700;font-size:40px;line-height:1.15;margin:0}
.lead .kr{color:var(--muted);font-size:14px;margin:6px 0 16px}
.lead .raw{font-family:var(--serif);font-size:22px;line-height:1.75;margin:0 0 14px}
.raw mark{background:var(--mark);color:inherit;border-bottom:2px solid var(--jade);padding:0 1px}
.meta{font-size:13px;color:var(--muted)}
.why{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px}
.tg{font-size:12.5px;border:1px solid var(--line);border-radius:5px;padding:1px 7px;font-family:var(--serif)}
.tg.hit{background:var(--jade-soft);border-color:var(--jade);color:var(--jade)}
.tg.opt{border-style:dashed}
.tg.neg{color:var(--plum);border-color:var(--plum);text-decoration:line-through}
.tg small{font-family:var(--sans);color:var(--muted);margin-left:3px}

.sec{margin:26px 0 10px;display:flex;align-items:baseline;gap:10px}
.sec h3{margin:0;font-size:16px;font-weight:600}
.sec span{font-size:13px;color:var(--muted)}

.diff{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
.dchip{display:inline-flex;align-items:stretch;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--panel)}
.dchip button{border:0;background:none;cursor:pointer;padding:4px 9px}
.dchip .a{font-family:var(--serif);font-size:15px}
.dchip .a small{font-family:var(--sans);font-size:11px;color:var(--muted);margin-left:4px}
.dchip .b{border-left:1px solid var(--line);font-size:12px;color:var(--plum)}
.dchip .a:hover{background:var(--jade-soft)} .dchip .b:hover{background:var(--plum-soft)}

.list{border-top:1px solid var(--line)}
.row{border-bottom:1px solid var(--line);padding:14px 2px}
.row .top{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.row .rk{font-size:12px;color:var(--muted);min-width:22px}
.row .nm{font-family:var(--serif);font-weight:600;font-size:21px}
.row .kr{font-size:13px;color:var(--muted)}
.row .ex{margin-left:auto;font-size:12.5px;color:var(--muted)}
.row .raw{font-family:var(--serif);font-size:16px;margin:4px 0 0 34px}
.row .why,.row details{margin-left:34px}
details{margin-top:8px;font-size:13px}
details summary{cursor:pointer;color:var(--muted)}
details .inh{margin:8px 0 0;display:flex;flex-wrap:wrap;gap:5px}
.link{border:0;background:none;padding:0;color:var(--jade);cursor:pointer;text-decoration:underline;text-underline-offset:3px;font:inherit}
.miss{font-size:12.5px;color:var(--plum);margin:4px 0 0 34px}

.flist .row.nd{opacity:.55}
.fsearch{display:flex;gap:8px;margin-bottom:14px;max-width:520px}
.fsearch input{flex:1;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink);font:inherit}
.note{font-size:12.5px;color:var(--muted);margin:4px 0 0 34px}

.foot{font-size:12.5px;color:var(--muted);max-width:640px;margin-top:40px;line-height:1.7}

.dose{display:flex;flex-wrap:wrap;gap:4px 14px;align-items:baseline;margin:10px 0 0;font-size:14px}
.dose .dl{font-size:12px;color:var(--paper);background:var(--ink);border-radius:4px;padding:0 6px}
.dose .hb b{font-family:var(--serif);font-weight:600;font-size:15px}
.dose .hb small{color:var(--muted);font-size:12px}
.dose .hb i{color:var(--muted);font-style:normal;font-size:12px}
.lead .dose{font-size:16px;padding:12px 0 2px;border-top:1px dashed var(--line);margin-top:14px}
.lead .dose .hb b{font-size:18px}
.row .dose,.row .dm{margin-left:34px}
.dm{font-size:12px;color:var(--muted);margin:4px 0 0}
@media (max-width:820px){.row .dose,.row .dm{margin-left:0}}
.comp{display:flex;gap:10px;align-items:baseline;margin:10px 0 0;font-size:15px}
.comp .dl,.jw .lb,.yjbox .lb{font-size:12px;color:var(--paper);background:var(--jade);border-radius:4px;padding:0 6px;white-space:nowrap}
.jw{margin:14px 0 0;font-family:var(--serif);font-size:15.5px;line-height:1.8}
.jw p{margin:4px 0 0}
.jw.fk .lb{background:var(--plum)}
.lead .jw{font-size:17px}
.yjbox{margin:16px 0 0}
.yj{margin-top:8px;border-top:1px solid var(--line)}
.yjr{display:grid;grid-template-columns:96px 1fr;gap:10px;padding:6px 0;border-bottom:1px solid var(--line);font-size:14px}
.yjr.on{background:var(--jade-soft)}
.yjh b{font-family:var(--serif);font-size:16px;display:block}
.yjh small{color:var(--muted);font-size:11.5px}
.yjt{font-family:var(--serif);line-height:1.65}
.yjt i{color:var(--muted);font-style:normal;font-family:var(--sans);font-size:12.5px}
.row .comp,.row .jw,.row .yjbox{margin-left:34px}
.hgrp{margin:0 0 16px}
.chip .k b{font-weight:600;color:var(--jade)}
.chip.on .k b{color:var(--paper)}
.chip.zero{opacity:.32;pointer-events:none}
@media (max-width:820px){.row .comp,.row .jw,.row .yjbox{margin-left:0}.yjr{grid-template-columns:80px 1fr}}
.hgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(70px,1fr));gap:2px 6px;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--paper)}
.hgrid+.hgrid{margin-top:6px}
.hk{display:flex;align-items:center;gap:5px;font-size:14px;cursor:pointer;padding:3px 0;white-space:nowrap}
.hk input{width:15px;height:15px;margin:0;accent-color:var(--jade);flex:none}
.hk:has(input:checked) span{color:var(--jade);font-weight:600}
.hk.dead{opacity:.3;cursor:default}
.hbtns{display:flex;gap:16px;margin-top:8px;font-size:13px}
.herbsec{margin-top:6px;padding-top:14px;border-top:2px solid var(--line)}
.pill.herb{font-family:var(--sans);font-size:13.5px;border-style:dashed}
.mbar{display:none}
@media (max-width:820px){
  .head{padding:20px 16px 14px}
  .head h1{font-size:34px}
  .tabs{margin-left:0;width:100%}
  .tabs button{flex:1}
  .wrap{grid-template-columns:1fr}
  .side{position:static;max-height:none;border-right:0;border-bottom:1px solid var(--line);padding:16px}
  .main{padding:18px 16px 90px}
  .lead{padding:20px}
  .lead .nm{font-size:32px}
  .lead .raw{font-size:19px}
  .row .raw,.row .why,.row details,.miss,.note{margin-left:0}
  .mbar{display:block;position:fixed;left:0;right:0;bottom:0;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--paper);border:0;font-weight:600;text-align:center;cursor:pointer;width:100%}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

const mapA=arr=>[...new Set((arr||[]).map(mapT).filter(Boolean))];
FD.forEach(([id,name,kr,raw,p,r,o,x,note])=>{

});

function resolve(id){
  const f=F[id]; if(f.eff) return f;
  const eff=new Map(); const negs=new Set(); let depth=0;
  f.p.forEach(pid=>{
    const pf=resolve(pid); depth=Math.max(depth,pf.depth+1);
    pf.eff.forEach((v,t)=>{const c=eff.get(t); if(!c||(v.req&&!c.req)) eff.set(t,{req:v.req,src:v.src});});
    pf.negs.forEach(n=>negs.add(n));
  });
  f.x.forEach(n=>{negs.add(n); [n,...desc(n)].forEach(k=>eff.delete(k));});
  f.r.forEach(t=>{eff.set(t,{req:true,src:id}); negs.delete(t); anc(t).forEach(a=>negs.delete(a));});
  f.o.forEach(t=>{if(!eff.has(t)) eff.set(t,{req:false,src:id});});
  const exp=new Set(); const expReq=new Set();
  eff.forEach((v,t)=>{[t,...anc(t)].forEach(a=>{exp.add(a); if(v.req) expReq.add(a);});});
  Object.assign(f,{eff,negs,depth,exp,expReq});
  return f;
}
ORDER.forEach(id=>{if(!F[id].nd) resolve(id);});

function search(pos,neg){
  const full=[], part=[];
  ORDER.forEach(id=>{
    const f=F[id]; if(f.nd) return;
    if(neg.some(n=>f.expReq.has(n))) return;
    if(pos.some(t=>[t,...anc(t)].some(a=>f.negs.has(a)))) return;
    const hit=pos.filter(t=>f.exp.has(t)), miss=pos.filter(t=>!f.exp.has(t));
    if(!hit.length) return;
    const cover=new Set(); pos.forEach(t=>{cover.add(t); anc(t).forEach(a=>cover.add(a));});
    let extra=0; const extras=[]; let optHit=false, hasOpt=false;
    f.eff.forEach((v,t)=>{
      const covered=cover.has(t);
      if(v.req){ if(!covered){extra++;extras.push(t);} }
      else { hasOpt=true; if(covered) optHit=true; }
    });
    let score=extra+(hasOpt&&!optHit?0.5:0);
    pos.forEach(t=>{ if(f.exp.has(t)&&!f.expReq.has(t)) score+=0.3; });
    neg.forEach(n=>{ if(f.negs.has(n)) score-=0.5; });
    score=Math.round(score*10)/10;
    const item={f,hit,miss,score,extras};
    (miss.length?part:full).push(item);
  });
  const cmp=(a,b)=>a.score-b.score||a.f.depth-b.f.depth||ORDER.indexOf(a.f.id)-ORDER.indexOf(b.f.id);
  full.sort(cmp);
  part.sort((a,b)=>b.hit.length-a.hit.length||cmp(a,b));
  return {full,part};
}
function discriminators(items,pos,neg){
  const n=items.length; if(n<2) return [];
  const cnt=new Map();
  items.forEach(({f})=>{f.exp.forEach(t=>cnt.set(t,(cnt.get(t)||0)+1));});
  const skip=new Set([...pos,...neg]); pos.forEach(t=>anc(t).forEach(a=>skip.add(a)));
  const out=[];
  cnt.forEach((c,t)=>{ if(c<n && !skip.has(t)) out.push({t,c,s:Math.min(c,n-c)}); });
  out.sort((a,b)=>b.s-a.s||b.c-a.c);
  return out.slice(0,14);
}

function setTag(k,v){v?state.set(k,v):state.delete(k); render();}

function highlight(f,tags){
  const forms=new Set();
  tags.forEach(t=>{
    [t,...desc(t)].forEach(k=>{ if(f.eff.has(k)){ const src=f.eff.get(k).src;
      if(src===f.id) T[k].forms.forEach(x=>forms.add(x));
      else { f.p.forEach(pid=>{forms.add(F[pid].name+'證'); forms.add(F[pid].name);}); }
    }});
  });
  let s=esc(f.raw); if(!forms.size) return s;
  const list=[...forms].filter(Boolean).sort((a,b)=>b.length-a.length).map(x=>x.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'));
  return s.replace(new RegExp(list.join('|'),'g'),m=>`<mark>${m}</mark>`);
}
function tagLine(f,pos){
  const cover=new Set(); pos.forEach(t=>{cover.add(t);anc(t).forEach(a=>cover.add(a));});
  const req=[],opt=[];
  f.eff.forEach((v,t)=>{ const h=cover.has(t)||desc(t).some(d=>pos.includes(d)); const inh=v.src!==f.id?`<small>${F[v.src].name}</small>`:'';
    (v.req?req:opt).push(`<span class="tg${h?' hit':''}${v.req?'':' opt'}" title="${T[t].kr}">${t}${inh}</span>`);});
  const ng=[...f.negs].map(t=>`<span class="tg neg" title="없음">${t}</span>`);
  return req.join('')+(opt.length?opt.join(''):'')+ng.join('');
}
function lineage(f){
  if(!f.p.length) return '';
  return '상위 방증: '+f.p.map(pid=>`<button class="link" data-open="${pid}">${F[pid].name}</button>`).join(' + ');
}
const hsel=new Set();
const HLABEL={'출':'백출','인진호':'인진'};
const hl=h=>HLABEL[h]||h;
let hmore=false;
function buildHerbBox(){
  const box=$('#herbbox');
  const common=HERBS.filter(h=>HFREQ[h]>=2).sort((a,b)=>hl(a).localeCompare(hl(b),'ko'));
  const rare=HERBS.filter(h=>HFREQ[h]<2).sort((a,b)=>hl(a).localeCompare(hl(b),'ko'));
  const cb=h=>`<label class="hk" data-h="${h}" title="${hz(h)}"><input type="checkbox" value="${h}"${hsel.has(h)?' checked':''}><span>${hl(h)}</span></label>`;
  box.innerHTML=`<section class="cat herbsec"><h2>약재로 구별 <span class="hz">藥材</span></h2>
    <p class="legend" style="margin:0 0 8px">체크한 약재가 모두 들어간 처방만 남깁니다. 증상과 함께 쓰면 증상 결과 안에서 좁혀집니다.</p>
    <div class="hgrid">${common.map(cb).join('')}</div>
    <div class="hgrid" id="hrare"${hmore?'':' hidden'}>${rare.map(cb).join('')}</div>
    <div class="hbtns"><button type="button" class="link" id="hmore">${hmore?'드문 약재 접기':'드문 약재 더보기 ('+rare.length+')'}</button>
    <button type="button" class="link" id="hclear">약재 선택 해제</button></div></section>`;
  box.querySelectorAll('input').forEach(i=>i.onchange=()=>{i.checked?hsel.add(i.value):hsel.delete(i.value); render();});
  $('#hmore').onclick=()=>{hmore=!hmore; buildHerbBox(); render();};
  $('#hclear').onclick=()=>{hsel.clear(); buildHerbBox(); render();};
}
function herbOK(f,herbs){ return !herbs.length||(f.hb&&herbs.every(h=>f.hb.h.includes(h))); }
function dimHerbs(pool){
  const cnt={}; pool.forEach(hs=>hs.forEach(h=>cnt[h]=(cnt[h]||0)+1));
  document.querySelectorAll('.hk').forEach(l=>{const h=l.dataset.h; const on=hsel.has(h); l.querySelector('input').checked=on;
    const dead=pool.length>0&&!on&&!cnt[h]; l.classList.toggle('dead',dead); l.querySelector('input').disabled=dead;});
}
function render(){
  document.querySelectorAll('.chip').forEach(b=>{const v=state.get(b.dataset.k)||0; b.classList.toggle('on',v===1); b.classList.toggle('off',v===2); b.setAttribute('aria-pressed',v?'true':'false');});
  const pos=[...state].filter(([,v])=>v===1).map(([k])=>k), neg=[...state].filter(([,v])=>v===2).map(([k])=>k);
  const herbs=[...hsel];
  const R=$('#results');
  const sel=`<div class="sel"><span class="lab">선택</span>${pos.map(k=>`<button class="pill" data-rm="${k}">${k}</button>`).join('')}${neg.map(k=>`<button class="pill no" data-rm="${k}">${k}</button>`).join('')}${herbs.map(k=>`<button class="pill herb" data-hx="${k}">${hl(k)}</button>`).join('')}</div>`;
  if(!pos.length&&!herbs.length){
    dimHerbs([]);
    R.innerHTML=(neg.length?sel:'')+`<div class="empty"><p class="big">있는 증상을 하나씩 눌러 보세요.</p><p>누를 때마다 『方極』 주치에 그 증상이 모두 들어 있는 처방만 남습니다. 왼쪽 맨 아래 「약재로 구별」에서 약재를 체크하면 그 약재가 든 처방으로 다시 좁혀집니다.</p><button class="btn" id="demo">예시: 上衝 + 頭痛 + 發熱</button></div>`+foot();
    const d=$('#demo'); if(d) d.onclick=()=>{state.clear();['上衝','頭痛','發熱'].forEach(k=>state.set(k,1));render();};
    bind(R); $('#mbar').textContent='증상을 선택하세요'; return;
  }
  if(!pos.length){
    const list=HDB.items.filter(it=>herbs.every(h=>it.h.includes(h))).sort((a,b)=>a.h.length-b.h.length||a.n.localeCompare(b.n,'ko'));
    dimHerbs(list.map(it=>it.h));
    let h=sel+`<div class="yjbox"><span class="lb">『藥徵』 주치</span>${yjHTML(herbs)}</div>`;
    h+=`<div class="sec"><h3>약재가 모두 든 처방</h3><span>${list.length}개, 약재 수가 적은 순. 증상을 함께 누르면 더 좁혀집니다</span></div><div class="list">`+
      (list.length?list.slice(0,80).map((it,i)=>hrow(it,i+1,herbs)).join(''):'<p class="meta" style="padding:14px 0">조건에 맞는 처방이 없습니다.</p>')+'</div>';
    R.innerHTML=h+foot(); bind(R); $('#mbar').textContent=`해당 처방 ${list.length}개 보기`; return;
  }
  let {full,part}=search(pos,neg);
  dimHerbs(full.map(it=>it.f.hb?it.f.hb.h:[]));
  full=full.filter(it=>herbOK(it.f,herbs)); part=part.filter(it=>herbOK(it.f,herbs));
  let h=sel;
  if(full.length){
    const top=full[0].f;
    h+=`<article class="lead"><h2 class="nm">${top.name}</h2><p class="kr">${top.kr} · 方極 ${/^\d/.test(top.id)?top.id+'번':''}</p>
      <p class="raw">${highlight(top,pos)}</p>
      ${top.note?`<p class="meta">${esc(top.note)}</p>`:''}
      ${compHTML(top.hb)}${top.dose?doseHTML(top.dose):'<p class="dm">용량표에 없는 처방입니다.</p>'}${top.dnote?`<p class="dm">${top.dnote}</p>`:''}
      ${textHTML(top.hb)}${top.hb?`<div class="yjbox"><span class="lb">『藥徵』 주치</span>${yjHTML(top.hb.h,herbs)}</div>`:''}
      <p class="meta">${lineage(top)}</p>
      <div class="why">${tagLine(top,pos)}</div>
      <p class="meta" style="margin-top:12px">${full[0].extras.length?`선택하지 않은 주치: ${full[0].extras.join(', ')}`:'선택한 증상이 주치와 정확히 일치합니다.'}</p></article>`;
    const dis=discriminators(full,pos,neg);
    if(dis.length){
      h+=`<div class="sec"><h3>감별할 증상</h3><span>후보 ${full.length}개를 가르는 증상입니다. 누르면 있음, 오른쪽은 없음</span></div><div class="diff">`+
        dis.map(d=>`<span class="dchip"><button class="a" data-add="${d.t}">${d.t}<small>${d.c}/${full.length}</small></button><button class="b" data-no="${d.t}" aria-label="${d.t} 없음">없음</button></span>`).join('')+'</div>';
    }
    if(full.length>1){
      h+=`<div class="sec"><h3>모두 일치</h3><span>${full.length}개, 선택하지 않은 주치가 적은 순</span></div><div class="list">`+
        full.slice(1,40).map((it,i)=>row(it,i+2,pos)).join('')+'</div>';
      if(full.length>40) h+=`<p class="meta">외 ${full.length-40}개. 증상이나 약재를 더 선택해 좁혀 보세요.</p>`;
    }
  } else {
    h+=`<div class="empty"><p class="big">선택한 ${herbs.length?'증상과 약재를':'증상을'} 모두 갖춘 처방이 없습니다.</p><p>아래는 일부만 일치하는 처방입니다. 빨간 글씨가 해당 처방 주치에 없는 증상입니다.</p></div>`;
  }
  if(part.length){
    h+=`<div class="sec"><h3>일부 일치</h3><span>${full.length?'참고용':''}</span></div><div class="list">`+
      part.slice(0,full.length?6:15).map((it,i)=>row(it,null,pos)).join('')+'</div>';
  }
  R.innerHTML=h+foot(); bind(R);
  $('#mbar').textContent=full.length?`일치 처방 ${full.length}개 보기`:'일부 일치 처방 보기';
}
function row(it,rank,pos){
  const f=it.f;
  return `<div class="row"><div class="top"><span class="rk">${rank||''}</span><span class="nm">${f.name}</span><span class="kr">${f.kr}</span>
    <span class="ex">${it.miss.length?`${it.hit.length}/${it.hit.length+it.miss.length} 일치`:(it.extras.length?`추가 주치 ${it.extras.length}`:'정확 일치')}</span></div>
    <p class="raw">${highlight(f,pos)}</p>
    ${it.miss.length?`<p class="miss">없는 증상: ${it.miss.join(', ')}</p>`:''}
    ${f.note?`<p class="note">${esc(f.note)}</p>`:''}
    ${f.dose?doseHTML(f.dose,true):''}
    <details><summary>전체 주치, 조문, 약재 주치 보기</summary><p class="meta" style="margin:6px 0 0">${lineage(f)}</p><div class="inh">${tagLine(f,pos)}</div>${compHTML(f.hb)}${textHTML(f.hb)}${f.hb?`<div class="yjbox"><span class="lb">『藥徵』 주치</span>${yjHTML(f.hb.h)}</div>`:''}</details></div>`;
}
function foot(){return `<p class="foot">주치 분해는 원문을 증상 단위로 나눈 뒤 임상용으로 비슷한 증상을 통합한 것입니다. 上衝劇·拘攣劇처럼 정도를 나타내는 표현은 태그에서 빠지고 처방별 메모로 남습니다. 或·若으로 이어진 증상은 점선(선택적 주치)으로, 不~ 표현은 취소선(해당 증상 없음)으로 표시했습니다. 越婢湯 「不咳嗽 上衝」 등 일부 구절은 해석이 갈릴 수 있어 처방별 메모로 남겼습니다. 원용량은 「상한금궤처방상용용량」 엑셀을 처방명으로 연결한 것입니다. 용량이 0으로 적힌 약재(肉桂·黨參·川烏·枳殼 등)는 앞 약재의 대체약으로 표시했습니다. 주치가 비어 있는 처방(麻黃附子湯, 小靑龍加石膏湯, 柴胡加龍骨牡蠣湯 등)은 검색에서 빠지며 처방 목록에서 확인할 수 있습니다.</p>`;}
function bind(R){
  R.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>setTag(b.dataset.rm,0));
  R.querySelectorAll('[data-hx]').forEach(b=>b.onclick=()=>{hsel.delete(b.dataset.hx);buildHerbBox();render();});
  R.querySelectorAll('[data-load]').forEach(b=>b.onclick=()=>loadFormula(b.dataset.load));
  R.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>setTag(b.dataset.add,1));
  R.querySelectorAll('[data-no]').forEach(b=>b.onclick=()=>setTag(b.dataset.no,2));
  R.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{showList(); const q=$('#fq'); q.value=F[b.dataset.open].name; renderList();});
}
function loadFormula(id){
  const f=F[id]; state.clear(); f.eff.forEach((v,t)=>{if(v.req) state.set(t,1);}); showFind(); render();
}
function renderList(){
  const q=$('#fq').value.trim();
  const L=$('#flist');
  L.innerHTML=ORDER.filter(id=>{const f=F[id]; return !q||f.name.includes(q)||f.kr.includes(q);}).map(id=>{
    const f=F[id];
    return `<div class="row${f.nd?' nd':''}"><div class="top"><span class="rk">${/^\d/.test(id)?id:''}</span><span class="nm">${f.name}</span><span class="kr">${f.kr}</span>
    ${f.nd?'<span class="ex">주치 미기재</span>':`<span class="ex"><button class="link" data-load="${id}">이 주치로 검색</button></span>`}</div>
    ${f.raw?`<p class="raw">${esc(f.raw)}</p>`:''}${f.note?`<p class="note">${esc(f.note)}</p>`:''}
    ${f.dose?doseHTML(f.dose):''}${f.dnote?`<p class="dm" style="margin-left:34px">${f.dnote}</p>`:''}${f.hb?`<details style="margin-left:34px"><summary>구성, 조문, 약재 주치</summary>${compHTML(f.hb)}${textHTML(f.hb)}<div class="yjbox"><span class="lb">『藥徵』 주치</span>${yjHTML(f.hb.h)}</div></details>`:''}
    ${f.nd?'':`<div class="why" style="margin-left:34px">${tagLine(f,[])}</div>`}</div>`;}).join('');
  const extra=Object.keys(DOSE).filter(k=>!USED.has(k)&&(!q||k.includes(q)));
  L.innerHTML+= extra.length?`<div class="sec"><h3>용량표에만 있는 처방</h3><span>『方極』 주치가 없어 검색에는 나오지 않습니다 (${extra.length}개)</span></div>`+
    extra.map(k=>`<div class="row"><div class="top"><span class="rk"></span><span class="nm">${k}</span></div>${doseHTML(k)}</div>`).join(''):'';
  if(!L.innerHTML) L.innerHTML='<p class="meta">검색 결과가 없습니다.</p>';
  L.querySelectorAll('[data-load]').forEach(b=>b.onclick=()=>loadFormula(b.dataset.load));
}

const hstate=new Map();
function hcands(){
  const inc=[...hstate].filter(([,v])=>v===1).map(([k])=>k), exc=[...hstate].filter(([,v])=>v===2).map(([k])=>k);
  return {inc,exc,list:HDB.items.filter(it=>inc.every(h=>it.h.includes(h))&&!exc.some(h=>it.h.includes(h)))};
}
function buildHerbPalette(){
  const box=$('#hpalette'); box.innerHTML='';
  const groups=[['자주 쓰는 약재','10방 이상',h=>HFREQ[h]>=10],['보통','3~9방',h=>HFREQ[h]>=3&&HFREQ[h]<10],['드문 약재','1~2방',h=>HFREQ[h]<3]];
  groups.forEach(([lab,sub,fn])=>{
    const sec=document.createElement('section'); sec.className='cat hgrp';
    sec.innerHTML=`<h2>${lab} <span class="hz">${sub}</span></h2>`;
    const ch=document.createElement('div'); ch.className='chips';
    HERBS.filter(fn).forEach(h=>{
      const b=document.createElement('button'); b.type='button'; b.className='chip hchip'; b.dataset.h=h;
      b.innerHTML=`<span class="h">${hz(h)||h}</span><span class="k">${h} <b></b></span>`;
      b.onclick=()=>{const v=hstate.get(h)||0,nv=(v+1)%3; nv?hstate.set(h,nv):hstate.delete(h); renderHerb();};
      ch.appendChild(b);
    });
    sec.appendChild(ch); box.appendChild(sec);
  });
}
function renderHerb(){
  const {inc,exc,list}=hcands();
  const cnt={}; list.forEach(it=>it.h.forEach(h=>cnt[h]=(cnt[h]||0)+1));
  document.querySelectorAll('.hchip').forEach(b=>{const h=b.dataset.h,v=hstate.get(h)||0;
    b.classList.toggle('on',v===1); b.classList.toggle('off',v===2);
    b.classList.toggle('zero',!v&&!cnt[h]); b.querySelector('b').textContent=cnt[h]||(v?'':'0');});
  const R=$('#hresults');
  const sel=`<div class="sel"><span class="lab">선택</span>${inc.map(k=>`<button class="pill" data-hrm="${k}">${hz(k)||k}</button>`).join('')}${exc.map(k=>`<button class="pill no" data-hrm="${k}">${hz(k)||k}</button>`).join('')}</div>`;
  if(!inc.length&&!exc.length){
    R.innerHTML=`<div class="empty"><p class="big">써야 할 약재를 하나씩 눌러 보세요.</p><p>누를 때마다 그 약재가 모두 들어간 처방만 남습니다. 예를 들어 半夏를 누른 뒤 茯苓을 누르면 두 약재가 함께 든 처방만 모입니다. 구성은 「상한론처방 일우의 주증들」 문서 기준입니다.</p><button class="btn" id="hdemo">예시: 半夏 + 茯苓</button></div>`;
    $('#hdemo').onclick=()=>{hstate.clear();hstate.set('반하',1);hstate.set('복령',1);renderHerb();};
    $('#mbar').textContent='약재를 선택하세요'; return;
  }
  list.sort((a,b)=>a.h.length-b.h.length||a.n.localeCompare(b.n,'ko'));
  let h=sel;
  if(inc.length) h+=`<div class="yjbox"><span class="lb">『藥徵』 주치</span>${yjHTML(inc)}</div>`;
  const co=Object.entries(cnt).filter(([k])=>!hstate.has(k)&&cnt[k]<list.length).sort((a,b)=>Math.min(b[1],list.length-b[1])-Math.min(a[1],list.length-a[1])||b[1]-a[1]).slice(0,14);
  if(co.length&&list.length>1) h+=`<div class="sec"><h3>함께 쓰인 약재로 좁히기</h3><span>후보 ${list.length}개를 가르는 약재. 누르면 포함, 오른쪽은 제외</span></div><div class="diff">`+
    co.map(([k,c])=>`<span class="dchip"><button class="a" data-hadd="${k}">${hz(k)||k}<small>${k} ${c}/${list.length}</small></button><button class="b" data-hno="${k}">제외</button></span>`).join('')+'</div>';
  h+=`<div class="sec"><h3>해당 처방</h3><span>${list.length}개, 약재 수가 적은 순</span></div><div class="list">`+
    (list.length?list.slice(0,80).map((it,i)=>hrow(it,i+1,inc)).join(''):'<p class="meta" style="padding:14px 0">조건에 맞는 처방이 없습니다.</p>')+'</div>';
  if(list.length>80) h+=`<p class="meta">외 ${list.length-80}개. 약재를 더 선택해 좁혀 보세요.</p>`;
  R.innerHTML=h;
  R.querySelectorAll('[data-hrm]').forEach(b=>b.onclick=()=>{hstate.delete(b.dataset.hrm);renderHerb();});
  R.querySelectorAll('[data-hadd]').forEach(b=>b.onclick=()=>{hstate.set(b.dataset.hadd,1);renderHerb();});
  R.querySelectorAll('[data-hno]').forEach(b=>b.onclick=()=>{hstate.set(b.dataset.hno,2);renderHerb();});
  R.querySelectorAll('[data-load]').forEach(b=>b.onclick=()=>loadFormula(b.dataset.load));
  $('#mbar').textContent=`해당 처방 ${list.length}개 보기`;
}
function hrow(it,rank,inc){
  const f=it.fid?F[it.fid]:null;
  return `<div class="row"><div class="top"><span class="rk">${rank}</span><span class="nm">${f?f.name:it.n}</span><span class="kr">${f?f.kr:''}${it.alias.length?' ('+it.alias.join(', ')+')':''}</span>
    <span class="ex">${it.h.length}미${f&&!f.nd?` · <button class="link" data-load="${f.id}">方極 주치로 검색</button>`:''}</span></div>
    <div class="comp"><span class="dl">구성</span><span>${esc(it.comp)}</span></div>
    ${f&&f.raw?`<p class="raw">${esc(f.raw)}</p>`:''}
    <details><summary>조문과 약재 주치 보기</summary>${textHTML(it)}<div class="yjbox"><span class="lb">『藥徵』 주치</span>${yjHTML(it.h,inc)}</div></details></div>`;
}
let VIEW='find';
function showView(v){VIEW=v;
  [['find','#viewFind','#tabFind'],['list','#viewList','#tabList']].forEach(([k,vs,ts])=>{$(vs).hidden=k!==v;$(ts).setAttribute('aria-selected',k===v?'true':'false');});
  $('#mbar').hidden=v==='list'; if(v==='list')renderList(); if(v==='find')render();}
function showFind(){showView('find');} function showList(){showView('list');}
$('#tabFind').onclick=()=>showView('find'); $('#tabList').onclick=()=>showView('list');
$('#fq').oninput=renderList;
$('#reset').onclick=()=>{state.clear();render();};
$('#q').oninput=e=>{const q=e.target.value.trim(); document.querySelectorAll('.chip').forEach(b=>{const k=b.dataset.k; b.hidden=!!q&&!(k.includes(q)||T[k].kr.includes(q));});};
$('#mbar').onclick=()=>$(VIEW==='herb'?'#hresults':'#results').scrollIntoView({behavior:'smooth'});
buildPalette(); buildHerbBox(); render();
}
</script>
<script>
if('serviceWorker' in navigator){window.addEventListener('load',()=>{navigator.serviceWorker.register('./sw.js').catch(()=>{});});}
let deferredPrompt=null;const ib=document.getElementById('installBtn');
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;ib.hidden=false;});
ib.addEventListener('click',async()=>{if(!deferredPrompt)return;deferredPrompt.prompt();await deferredPrompt.userChoice;deferredPrompt=null;ib.hidden=true;});
window.addEventListener('appinstalled',()=>{ib.hidden=true;});
</script>
